backend:
  name: github
  repo: GoldenChaos/goldenchaos.github.io
  branch: master
  # Set these once you have a GitHub OAuth proxy endpoint for production auth.
  # base_url: https://your-auth-proxy.example.com
  # auth_endpoint: auth

local_backend:
  # Decap local proxy server (run with: npm run admin)
  url: http://localhost:8081/api/v1
publish_mode: simple

media_folder: "images"
public_folder: "/images"

collections:
  - name: "comics"
    label: "Comics"
    delete: false
    folder: "src/comics-data"
    create: true
    slug: "{{fields.comicId}}"
    extension: "json"
    format: "json"
    media_folder: "/images/comics"
    public_folder: "/images/comics"
    sort: "number:desc"
    sortable_fields: ["number", "title", "comicId", "date"]
    summary: "#{{fields.number}} - {{fields.title}}"
    fields:
      - { label: "Number", name: "number", widget: "number", value_type: "float", min: 0 }
      - { label: "Comic ID", name: "comicId", widget: "string", hint: "Numeric ID used in URLs, e.g. 4 or 3-1." }
      - { label: "Slug", name: "slug", widget: "string", hint: "Semantic part only, e.g. dont-tell-me-my-age." }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Alt text", name: "alt", widget: "string" }
      - { label: "Tooltip text", name: "titleText", widget: "text", required: false }
      - { label: "Publish date", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { label: "Main image", name: "image", widget: "image" }
      - { label: "Thumbnail image", name: "thumbImage", widget: "string", required: false, hint: "Auto-generated from Main image by sync script." }
      - { label: "Bald image", name: "baldImage", widget: "image", required: false, media_folder: "/images/comics/bald", public_folder: "/images/comics/bald" }
      - { label: "Bald thumbnail image", name: "baldThumbImage", widget: "string", required: false, hint: "Auto-generated from Bald image by sync script." }
      - { label: "Open Graph image", name: "ogImage", widget: "string", required: false, hint: "Auto-generated from Main image by sync script." }
      - { label: "Twitter image", name: "twitterImage", widget: "string", required: false, hint: "Auto-generated from Main image by sync script." }

  - name: "geckowo_comics_data"
    label: "Geckowo Comics"
    delete: false
    folder: "src/geckowo-comics-data"
    create: true
    slug: "{{fields.slug}}"
    extension: "json"
    format: "json"
    media_folder: "/images/geckowo/comics"
    public_folder: "/images/geckowo/comics"
    sort: "number:desc"
    sortable_fields: ["number", "title", "date"]
    summary: "#{{fields.number}}{{fields.summaryTitle}}"
    fields:
      - { label: "Number", name: "number", widget: "number", value_type: "int", min: 1 }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Title", name: "title", widget: "string", required: false }
      - { label: "Publish date", name: "date", widget: "datetime", required: false, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { label: "Summary Title", name: "summaryTitle", widget: "hidden", required: false }
      - { label: "Alt text", name: "alt", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Thumbnail image", name: "thumbImage", widget: "string", required: false, hint: "Auto-generated from Image by sync script." }
      - { label: "Open Graph image", name: "ogImage", widget: "image" }
      - { label: "Twitter image", name: "twitterImage", widget: "image" }
      - { label: "Post ID", name: "postId", widget: "hidden", required: false }

  - name: "geckowo_doodles_data"
    label: "Geckowo Doodles"
    delete: false
    folder: "src/geckowo-doodles-data"
    create: true
    slug: "{{fields.slug}}"
    extension: "json"
    format: "json"
    media_folder: "/images/geckowo/doodles"
    public_folder: "/images/geckowo/doodles"
    sort: "number:desc"
    sortable_fields: ["number", "title", "date"]
    summary: "#{{fields.number}}{{fields.summaryTitle}}"
    fields:
      - { label: "Number", name: "number", widget: "number", value_type: "int", min: 1 }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Title", name: "title", widget: "string", required: false }
      - { label: "Publish date", name: "date", widget: "datetime", required: false, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { label: "Summary Title", name: "summaryTitle", widget: "hidden", required: false }
      - { label: "Alt text", name: "alt", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Thumbnail image", name: "thumbImage", widget: "string", required: false, hint: "Auto-generated from Image by sync script." }
      - { label: "Open Graph image", name: "ogImage", widget: "image" }
      - { label: "Twitter image", name: "twitterImage", widget: "image" }
      - { label: "Post ID", name: "postId", widget: "hidden", required: false }
