        <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
        <script>
            window.OneSignalDeferred = window.OneSignalDeferred || [];
            console.log('OneSignal: Initializing...');
            OneSignalDeferred.push(async function(OneSignal) {
                console.log('OneSignal: SDK loaded, starting init');
                await OneSignal.init({
                    appId: "72940797-fce4-4404-92c2-a33aa17e19b3",
                    safari_web_id: "web.onesignal.auto.27841aa0-90c9-472e-b116-e68b5f82c9c6",
                    autoRegister: false,
                    allowLocalhostAsSecureOrigin: true,
                    welcomeNotification: {
                        message: "Thanks for subscribing! You'll get notifications when new comics are released <3"
                    }
                });
                console.log('OneSignal: Init complete', OneSignal);
                console.log('OneSignal: Notifications supported?', OneSignal.Notifications?.supported?.());
            });

            window.waitForOneSignalSubscription = function(OneSignal, timeoutMs = 10000) {
                const currentId = OneSignal.User.PushSubscription.id;
                const currentToken = OneSignal.User.PushSubscription.token;
                if (currentId && currentToken) return Promise.resolve(currentId);

                return new Promise((resolve) => {
                    let settled = false;
                    const finish = (subscriptionId) => {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timeoutId);
                        OneSignal.User.PushSubscription.removeEventListener('change', onChange);
                        resolve(subscriptionId || null);
                    };
                    const onChange = (event) => {
                        const subscriptionId = event.current?.id || OneSignal.User.PushSubscription.id;
                        const token = event.current?.token || OneSignal.User.PushSubscription.token;
                        if (subscriptionId && token) finish(subscriptionId);
                    };
                    const timeoutId = setTimeout(() => finish(null), timeoutMs);
                    OneSignal.User.PushSubscription.addEventListener('change', onChange);
                });
            };

            window.getOneSignalPermissionState = function(OneSignal) {
                if (OneSignal.Notifications.permission) return 'granted';
                if (typeof Notification !== 'undefined') return Notification.permission;
                return 'default';
            };

            window.waitForNativeNotificationPermission = function(permissionRequest, timeoutMs = 30000) {
                if (!permissionRequest) return Promise.resolve(null);

                return new Promise((resolve, reject) => {
                    const startedAt = Date.now();
                    const checkPermission = () => {
                        const permission = typeof Notification !== 'undefined' ? Notification.permission : 'default';
                        if (permission !== 'default') return resolve(permission);
                        if (Date.now() - startedAt >= timeoutMs) {
                            return reject(new Error('Native notification permission request timed out'));
                        }
                        setTimeout(checkPermission, 250);
                    };

                    Promise.resolve(permissionRequest).then((permission) => {
                        if (permission && permission !== 'default') resolve(permission);
                    }).catch(reject);
                    checkPermission();
                });
            };

            window.requestOneSignalPermission = function(OneSignal, timeoutMs = 10000) {
                return Promise.race([
                    OneSignal.Notifications.requestPermission(),
                    new Promise((_, reject) => setTimeout(() => {
                        reject(new Error('Notification permission request timed out'));
                    }, timeoutMs))
                ]);
            };
        </script>

  if (isIOS && !isStandalone) {
    document.documentElement.classList.add('is-ios-browser');
  }
})();
</script>
