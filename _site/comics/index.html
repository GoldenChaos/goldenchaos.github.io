<script>
async function copyWithFallback(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (err) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    let ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (copyErr) {
      console.error('Copy failed', copyErr);
    }
    document.body.removeChild(textarea);
    return ok;
  }
}
function showCopied(buttonId, success) {
  const btn = document.getElementById(buttonId);
  if (!btn) return;
  const originalHTML = btn.innerHTML;
  btn.innerHTML = success ? '<center><i class="fa-solid fa-check"></i>Copied!</center>' : '<center><i class="fa-solid fa-xmark"></i>Copy failed</center>';
  setTimeout(() => {
    btn.innerHTML = originalHTML;
  }, 2000);
}
async function copyComicLink() {
  const link = window.location.origin + '/comics/7/';
  const ok = await copyWithFallback(link);
  showCopied('copyBtn', ok);
  if (ok && typeof gtag !== 'undefined') {
    gtag('event', 'copy_link', {
      'event_category': 'engagement',
      'event_label': 'comic_link'
    });
  }
}
async function copyComicImageLink() {
  const img = document.querySelector('.comic-img');
  const src = img ? img.getAttribute('src') : '/images/comics/7_ally.png';
  const fullURL = new URL(src, window.location.origin).href;
  const ok = await copyWithFallback(fullURL);
  showCopied('copyImgBtn', ok);
  if (ok && typeof gtag !== 'undefined') {
    gtag('event', 'copy_link', {
      'event_category': 'engagement',
      'event_label': 'comic_image_link'
    });
  }
}

function updateBellIcon(buttonId, isSubscribed) {
  const btn = document.getElementById(buttonId);
  if (!btn) return;
  const icon = btn.querySelector('i');
  if (icon) {
    icon.className = 'fa-solid fa-bell';
  }
  if (isSubscribed) {
    btn.classList.add('active');
  } else {
    btn.classList.remove('active');
  }
}

async function checkNotificationStatus(buttonId) {
  const btn = document.getElementById(buttonId);
  if (!btn) return;
  // Start with inactive state
  btn.classList.remove('active');
  
  if (!window.OneSignalDeferred) {
    // Remove no-transition after initial state is set
    setTimeout(() => btn.classList.remove('no-transition'), 50);
    return;
  }
  OneSignalDeferred.push(async function(OneSignal) {
    const subscriptionId = OneSignal.User.PushSubscription.id;
    const optedIn = OneSignal.User.PushSubscription.optedIn;
    // Only consider subscribed if we have a valid ID AND opted in is true
    const isSubscribed = (typeof subscriptionId === 'string' && subscriptionId.length > 0 && optedIn === true);
    updateBellIcon(buttonId, isSubscribed);
    // Remove no-transition after initial state is set
    setTimeout(() => btn.classList.remove('no-transition'), 50);
  });
}

async function requestNotifications(buttonId) {
  const btn = document.getElementById(buttonId);
  if (!btn) return;
  if (!window.OneSignalDeferred) {
    alert('Push notifications are not available.');
    return;
  }
  
  const wasActive = btn.classList.contains('active');
  
  // If currently subscribed, handle unsubscribe
  if (wasActive) {
    btn.classList.add('pending');
    btn.disabled = true;
    OneSignalDeferred.push(async function(OneSignal) {
      try {
        await OneSignal.User.PushSubscription.optOut();
        btn.classList.remove('pending', 'active');
        updateBellIcon(buttonId, false);
        // Track unsubscribe in Google Analytics
        if (typeof gtag !== 'undefined') {
          gtag('event', 'notification_unsubscribe', {
            'event_category': 'engagement',
            'event_label': 'comic_notifications'
          });
        }
      } catch (error) {
        console.error('Unsubscribe error:', error);
        btn.classList.remove('pending');
        alert('Failed to unsubscribe. Please try again.');
      } finally {
        btn.disabled = false;
      }
    });
    return;
  }
  
  // Set pending state immediately for visual feedback
  btn.classList.add('pending');
  btn.disabled = true;
  OneSignalDeferred.push(async function(OneSignal) {
    try {
      // Check if already subscribed with OneSignal
      const subscriptionId = OneSignal.User.PushSubscription.id;
      const optedIn = OneSignal.User.PushSubscription.optedIn;
      
      // If already subscribed and opted in, just update UI
      if (subscriptionId && optedIn) {
        btn.classList.remove('pending');
        btn.classList.add('active');
        updateBellIcon(buttonId, true);
        btn.disabled = false;
        return;
      }
      const browserPermission = Notification.permission;
      if (browserPermission === 'denied') {
        alert('Push notifications are blocked. Please enable them in your browser settings.');
        btn.classList.remove('pending');
        btn.disabled = false;
        return;
      }
      
      // Set a safety timeout to clear pending state if something goes wrong
      const timeoutId = setTimeout(() => {
        btn.classList.remove('pending');
        btn.disabled = false;
        console.warn('Notification request timed out');
      }, 10000);
      
      try {
        // Try optIn first (v16 native method)
        try {
          await OneSignal.User.PushSubscription.optIn();
        } catch (optInError) {
          // Fallback to Slidedown
          await OneSignal.Slidedown.promptPush();
        }
      } catch (promptError) {
        clearTimeout(timeoutId);
        btn.classList.remove('pending');
        btn.disabled = false;
        console.error('Prompt error:', promptError);
        alert('Failed to show notification prompt. Please try again.');
        return;
      }
      
      clearTimeout(timeoutId);
      const newPermission = Notification.permission;
      if (newPermission === 'granted') {
        // Wait for OneSignal to sync the subscription to their servers
        await new Promise(resolve => setTimeout(resolve, 1500));
        
        // Check if subscription is actually registered with OneSignal
        const subscriptionId = OneSignal.User.PushSubscription.id;
        
        if (subscriptionId) {
          btn.classList.remove('pending');
          btn.classList.add('active');
          updateBellIcon(buttonId, true);
          // Track subscription in Google Analytics
          if (typeof gtag !== 'undefined') {
            gtag('event', 'notification_subscribe', {
              'event_category': 'engagement',
              'event_label': 'comic_notifications'
            });
          }
        } else {
          alert('Permission granted, but subscription sync failed. Please try again.');
          btn.classList.remove('pending');
        }
      } else if (newPermission === 'denied') {
        alert('You denied push notification permission.');
        btn.classList.remove('pending');
      } else {
        btn.classList.remove('pending');
      }
      btn.disabled = false;
    } catch (error) {
      console.error('Notification request error:', error);
      alert('Subscription failed. Please try again.');
      btn.classList.remove('pending');
      btn.disabled = false;
    }
  });
}

if (window.OneSignalDeferred) {
  OneSignalDeferred.push(async function(OneSignal) {
    checkNotificationStatus('notifyLatestComic');
  });
}
</script>
<script>
(function() {
  const STORAGE_KEY = 'gc-bald-mode';
  const SEEN_KEY = 'gc-bald-mode-seen';
  // Desktop: require full Konami plus Enter to reduce accidental triggers
  const KONAMI_DESKTOP = ['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a','enter'];
  // Mobile: D-pad only for tap gestures
  const KONAMI_TOUCH = ['up','up','down','down','left','right','left','right'];
  let keyBuffer = [];
  let touchBuffer = [];
  let touchTimeout;
  const toggleSelector = '[data-bald-toggle]';

  function applyBaldMode(enabled) {
    const imgs = document.querySelectorAll('[data-normal-image]');
    imgs.forEach((img) => {
      const normal = img.getAttribute('data-normal-image');
      const bald = img.getAttribute('data-bald-image');
      if (enabled && bald) {
        if (img.getAttribute('src') !== bald) {
          img.setAttribute('src', bald);
        }
      } else if (normal) {
        if (img.getAttribute('src') !== normal) {
          img.setAttribute('src', normal);
        }
      }
    });
    document.documentElement.dataset.baldMode = enabled ? 'on' : 'off';
    syncBaldToggles(enabled);
  }

  function syncBaldToggles(enabled) {
    const hasSeen = sessionStorage.getItem(SEEN_KEY) === 'on';
    const containers = document.querySelectorAll('[data-bald-toggle-container]');
    containers.forEach((container) => {
      if (hasSeen) {
        container.hidden = false;
        container.style.display = '';
      } else {
        container.hidden = true;
        container.style.display = 'none';
      }
    });
    const toggles = document.querySelectorAll(toggleSelector);
    toggles.forEach((toggle) => {
      const container = toggle.closest('.toggle-switch');
      if (enabled) {
        toggle.classList.add('active');
        toggle.setAttribute('aria-pressed', 'true');
        if (container) container.classList.add('active');
      } else {
        toggle.classList.remove('active');
        toggle.setAttribute('aria-pressed', 'false');
        if (container) container.classList.remove('active');
      }
    });
  }

  function setBaldMode(enabled) {
    sessionStorage.setItem(STORAGE_KEY, enabled ? 'on' : 'off');
    if (enabled) {
      sessionStorage.setItem(SEEN_KEY, 'on');
    }
    applyBaldMode(enabled);
  }

  function toggleBaldMode() {
    const next = sessionStorage.getItem(STORAGE_KEY) !== 'on';
    setBaldMode(next);
  }

  function handleKeydown(event) {
    keyBuffer.push(String(event.key).toLowerCase());
    if (keyBuffer.length > KONAMI_DESKTOP.length) {
      keyBuffer.shift();
    }
    if (keyBuffer.join(',') === KONAMI_DESKTOP.join(',')) {
      toggleBaldMode();
    }
  }

  function mapTouchDirection(evt, target) {
    const rect = target.getBoundingClientRect();
    const touch = evt.touches && evt.touches[0];
    if (!touch) return null;
    const xRatio = (touch.clientX - rect.left) / rect.width;
    const yRatio = (touch.clientY - rect.top) / rect.height;
    const horiz = xRatio < 0.35 ? 'left' : xRatio > 0.65 ? 'right' : null;
    const vert = yRatio < 0.35 ? 'up' : yRatio > 0.65 ? 'down' : null;
    // Prioritize vertical when clearly top/bottom; otherwise horizontal
    return vert || horiz;
  }

  function resetTouchBufferSoon() {
    clearTimeout(touchTimeout);
    touchTimeout = setTimeout(() => {
      touchBuffer = [];
    }, 5000);
  }

  function handleTouch(event) {
    const target = event.currentTarget;
    const dir = mapTouchDirection(event, target);
    if (!dir) return;
    touchBuffer.push(dir);
    if (touchBuffer.length > KONAMI_TOUCH.length) {
      touchBuffer.shift();
    }
    if (touchBuffer.join(',') === KONAMI_TOUCH.join(',')) {
      toggleBaldMode();
      touchBuffer = [];
      return;
    }
    resetTouchBufferSoon();
  }

  function attachTouchHandlers() {
    if (!('ontouchstart' in window)) return;
    const imgs = document.querySelectorAll('[data-normal-image]');
    imgs.forEach((img) => {
      img.addEventListener('touchstart', handleTouch, { passive: true });
    });
  }

  function attachToggleHandlers() {
    const toggles = document.querySelectorAll(toggleSelector);
    toggles.forEach((toggle) => {
      toggle.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        const next = sessionStorage.getItem(STORAGE_KEY) !== 'on';
        setBaldMode(next);
      });
      toggle.addEventListener('keydown', (event) => {
        const key = event.key;
        if (key !== 'Enter' && key !== ' ') return;
        event.preventDefault();
        event.stopPropagation();
        const next = sessionStorage.getItem(STORAGE_KEY) !== 'on';
        setBaldMode(next);
      });
    });
  }

  document.addEventListener('keydown', handleKeydown, true);
  document.addEventListener('DOMContentLoaded', () => {
    const enabled = sessionStorage.getItem(STORAGE_KEY) === 'on';
    applyBaldMode(enabled);
    attachTouchHandlers();
    attachToggleHandlers();
    setTimeout(() => {
      document.querySelectorAll('.toggle-switch.no-transition').forEach((toggle) => {
        toggle.classList.remove('no-transition');
      });
    }, 50);
  });
})();
</script>
